{{template "base.html" .}}

{{define "title"}}Fighters - UFC Matchmaker{{end}}

{{define "content"}}
<div class="container">
    <div class="page-header">
        <h1>UFC Fighters Roster</h1>
    </div>

    <div class="fighters-grid">
        {{range .Fighters}}
        <div class="fighter-card">
            <div class="fighter-image">
                <div class="fighter-placeholder">F</div>
            </div>
            <div class="fighter-info">
                <h3>{{.Name}}</h3>
                {{if .Nickname}}
                <p class="nickname">{{.Nickname}}</p>
                {{end}}
                <p class="record">{{.Wins}}-{{.Losses}}-{{.Draws}}</p>
                <p class="weight-class">{{.WeightClass}}</p>
            </div>
        </div>
        {{else}}
        <p class="no-results">No fighters found</p>
        {{end}}
    </div>
</div>
{{end}}
