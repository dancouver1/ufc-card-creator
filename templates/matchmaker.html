<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Match - UFC Matchmaker</title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/">UFC MATCHMAKER</a>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/fighters">Fighters</a></li>
                <li><a href="/matchmaker">Create Match</a></li>
                <li><a href="/cards">My Cards</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container" x-data="matchmaker()">
            <div class="page-header">
                <h1>Create a Match</h1>
            </div>

            <!-- Fighter Selection -->
            <div class="fighter-selection">
                <div class="select-fighter">
                    <h3>Select Fighter 1</h3>
                    <button @click="openFighterModal(1)" class="btn btn-primary">
                        <span x-show="!fighter1">Choose Fighter</span>
                        <span x-show="fighter1" x-text="fighter1?.name"></span>
                    </button>
                </div>

                <div class="vs-divider">
                    <span>VS</span>
                </div>

                <div class="select-fighter">
                    <h3>Select Fighter 2</h3>
                    <button @click="openFighterModal(2)" class="btn btn-primary">
                        <span x-show="!fighter2">Choose Fighter</span>
                        <span x-show="fighter2" x-text="fighter2?.name"></span>
                    </button>
                </div>
            </div>

            <!-- Tale of the Tape (Only shows when both fighters selected) -->
            <div x-show="fighter1 && fighter2" class="tale-of-tape">
                <!-- Card Selection -->
                <div class="event-header">
                    <label for="card-select" style="color: white; margin-right: 1rem;">Assign to Card:</label>
                    <select id="card-select" x-model="selectedCardId" class="card-select"
                        style="padding: 0.5rem; font-size: 1rem;">
                        <option value="">-- Select Card --</option>
                        {{range .Cards}}
                        <option value="{{.ID}}">{{.CardName}}</option>
                        {{end}}
                    </select>
                </div>

                <!-- Main Matchup -->
                <div class="matchup-container">
                    <!-- Fighter 1 -->
                    <div class="fighter-side">
                        <div class="fighter-image-large">
                            <img :src="fighter1?.fighter_image_url || '/static/images/placeholder.png'"
                                :alt="fighter1?.name">
                        </div>

                        <div class="fighter-flag">
                            <span x-text="getFlagEmoji(fighter1?.nationality)"></span>
                            <span class="record" x-text="getRecord(fighter1)"></span>
                        </div>

                        <div class="fighter-name-plate">
                            <h2 x-text="fighter1?.name"></h2>
                        </div>
                    </div>

                    <!-- Center Stats -->
                    <div class="center-stats">
                        <h3 class="last-5-title">LAST 5</h3>

                        <div class="last-5-container">
                            <!-- Fighter 1 Last 5 -->
                            <div class="last-5-left">
                                <template x-for="fight in fighter1?.last_5_fights || []" :key="fight.id">
                                    <div class="fight-result" :class="fight.result" x-text="fight.opponent_name">
                                    </div>
                                </template>
                            </div>

                            <!-- Fighter 2 Last 5 -->
                            <div class="last-5-right">
                                <template x-for="fight in fighter2?.last_5_fights || []" :key="fight.id">
                                    <div class="fight-result" :class="fight.result" x-text="fight.opponent_name">
                                    </div>
                                </template>
                            </div>
                        </div>

                        <h3 class="prediction-title">Prediction</h3>
                        <div class="prediction-selector">
                            <button @click="prediction = fighter1.id" :class="{'selected': prediction === fighter1?.id}"
                                class="prediction-btn" x-text="fighter1?.name">
                            </button>
                            <span class="or-text">or</span>
                            <button @click="prediction = fighter2.id" :class="{'selected': prediction === fighter2?.id}"
                                class="prediction-btn" x-text="fighter2?.name">
                            </button>
                        </div>
                    </div>

                    <!-- Fighter 2 -->
                    <div class="fighter-side">
                        <div class="fighter-image-large">
                            <img :src="fighter2?.fighter_image_url || '/static/images/placeholder.png'"
                                :alt="fighter2?.name">
                        </div>

                        <div class="fighter-flag">
                            <span x-text="getFlagEmoji(fighter2?.nationality)"></span>
                            <span class="record" x-text="getRecord(fighter2)"></span>
                        </div>

                        <div class="fighter-name-plate">
                            <h2 x-text="fighter2?.name"></h2>
                        </div>
                    </div>
                </div>

                <!-- Detailed Stats Comparison -->
                <div class="stats-comparison">
                    <div class="stat-row">
                        <div class="stat-value" x-text="getHeight(fighter1)"></div>
                        <div class="stat-label">HEIGHT</div>
                        <div class="stat-value" x-text="getHeight(fighter2)"></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-value" x-text="getWeight(fighter1)"></div>
                        <div class="stat-label">WEIGHT</div>
                        <div class="stat-value" x-text="getWeight(fighter2)"></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-value" x-text="getReach(fighter1)"></div>
                        <div class="stat-label">REACH</div>
                        <div class="stat-value" x-text="getReach(fighter2)"></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-value" x-text="fighter1?.stance || 'N/A'"></div>
                        <div class="stat-label">STANCE</div>
                        <div class="stat-value" x-text="fighter2?.stance || 'N/A'"></div>
                    </div>
                </div>

                <!-- Fight Options -->
                <div class="fight-options">
                    <h3>Fight Options</h3>
                    <div class="options-grid">
                        <div class="option-item">
                            <label class="checkbox-container">
                                <input type="checkbox" x-model="isMainEvent" @change="if(isMainEvent) rounds = 5">
                                <span class="checkmark"></span>
                                Main Event
                            </label>
                        </div>
                        <div class="option-item">
                            <label class="checkbox-container">
                                <input type="checkbox" x-model="isCoMainEvent">
                                <span class="checkmark"></span>
                                Co-Main Event
                            </label>
                        </div>
                        <div class="option-item">
                            <label class="checkbox-container">
                                <input type="checkbox" x-model="isTitleFight" @change="if(isTitleFight) rounds = 5">
                                <span class="checkmark"></span>
                                Title Fight
                            </label>
                        </div>
                    </div>

                    <div class="extra-options">
                        <div x-show="isTitleFight" class="option-field">
                            <label for="title-type">Title Type:</label>
                            <select id="title-type" x-model="titleType">
                                <option value="Undisputed">Undisputed</option>
                                <option value="Interim">Interim</option>
                                <option value="BMF">BMF</option>
                            </select>
                        </div>

                        <div class="option-field">
                            <label for="weight-class">Weight Class:</label>
                            <input type="text" id="weight-class" x-model="weightClass" placeholder="e.g. Lightweight"
                                style="padding: 0.5rem; border-radius: 4px; border: 1px solid #444; background: #222; color: white;">
                        </div>

                        <div class="option-field">
                            <label for="card-part">Card Part:</label>
                            <select id="card-part" x-model="cardPart"
                                style="padding: 0.5rem; background: #222; color: white; border: 1px solid #444; border-radius: 4px;">
                                <option value="Main Card">Main Card</option>
                                <option value="Prelims">Prelims</option>
                            </select>
                        </div>

                        <div class="option-field">
                            <label for="rounds-select">Rounds:</label>
                            <select id="rounds-select" x-model="rounds"
                                style="padding: 0.5rem; background: #222; color: white; border: 1px solid #444; border-radius: 4px;">
                                <option value="3">3 Rounds</option>
                                <option value="5">5 Rounds</option>
                            </select>
                        </div>
                    </div>

                    <!-- Save Match Button -->
                    <div class="save-section">
                        <button @click="saveMatch()" class="btn btn-success btn-lg">
                            Save Match to Card
                        </button>
                    </div>
                </div>

                <!-- Fighter Selection Modal -->
                <div x-show="showModal" x-cloak @click.self="showModal = false" class="modal-overlay">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Select Fighter</h2>
                            <button @click="showModal = false" class="close-btn">&times;</button>
                        </div>
                        <div class="modal-body">
                            <input type="text" x-model="modalSearch" placeholder="Search fighters..."
                                class="search-input" @input="searchFighters()">
                            <div class="modal-fighters-list">
                                <template x-for="fighter in modalFighters" :key="fighter.id">
                                    <div @click="selectFighter(fighter)" class="modal-fighter-item">
                                        <span x-text="fighter.name"></span>
                                        <span class="fighter-record"
                                            x-text="fighter.wins + '-' + fighter.losses"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <script>
                function matchmaker() {
                    return {
                        fighter1: null,
                        fighter2: null,
                        prediction: null,
                        selectedCardId: '',
                        showModal: false,
                        selectingFor: 1,
                        modalFighters: [],
                        modalSearch: '',
                        isMainEvent: false,
                        isCoMainEvent: false,
                        isTitleFight: false,
                        titleType: 'Undisputed',
                        cardPart: 'Main Card',
                        weightClass: '',
                        rounds: 3,

                        // Helper functions
                        getHeight(fighter) {
                            if (!fighter || !fighter.height_feet) return 'N/A';
                            const inches = fighter.height_inches || 0;
                            return fighter.height_feet + "'" + inches + '"';
                        },

                        getWeight(fighter) {
                            if (!fighter || !fighter.weight_lbs) return 'N/A';
                            return fighter.weight_lbs + ' lbs';
                        },

                        getReach(fighter) {
                            if (!fighter || !fighter.reach_cm) return 'N/A';
                            const inches = (fighter.reach_cm / 2.54).toFixed(1);
                            return inches + '"';
                        },

                        getRecord(fighter) {
                            if (!fighter) return '0-0-0';
                            return fighter.wins + '-' + fighter.losses + '-' + fighter.draws;
                        },

                        openFighterModal(fighterNumber) {
                            this.selectingFor = fighterNumber;
                            this.showModal = true;
                            this.searchFighters();
                        },

                        async searchFighters() {
                            const response = await fetch('/api/fighters?search=' + this.modalSearch);
                            this.modalFighters = await response.json();
                        },

                        async selectFighter(fighter) {
                            const response = await fetch('/api/fighter/' + fighter.id);
                            const fullFighter = await response.json();

                            if (this.selectingFor === 1) {
                                this.fighter1 = fullFighter;
                            } else {
                                this.fighter2 = fullFighter;
                            }

                            // Auto-populate weight class if both fighters selected
                            if (this.fighter1 && this.fighter2) {
                                this.weightClass = this.fighter1.weight_class;
                            } else if (fullFighter.weight_class) {
                                this.weightClass = fullFighter.weight_class;
                            }

                            this.showModal = false;
                        },

                        getFlagEmoji(nationality) {
                            const flags = {
                                'USA': '🇺🇸',
                                'France': '🇫🇷',
                                'Brazil': '🇧🇷',
                                'Russia': '🇷🇺',
                                'Ireland': '🇮🇪',
                            };
                            return flags[nationality] || '🏳️';
                        },

                        async saveMatch() {
                            if (!this.fighter1 || !this.fighter2) {
                                alert('Please select both fighters');
                                return;
                            }

                            if (!this.selectedCardId) {
                                alert('Please select a card to assign this match to');
                                return;
                            }

                            const matchData = {
                                card_id: parseInt(this.selectedCardId),
                                fighter1_id: this.fighter1.id,
                                fighter2_id: this.fighter2.id,
                                prediction: this.prediction,
                                rounds: parseInt(this.rounds),
                                weight_class: this.weightClass,
                                is_title_fight: this.isTitleFight,
                                is_main_event: this.isMainEvent,
                                is_co_main_event: this.isCoMainEvent,
                                title_type: this.isTitleFight ? this.titleType : null,
                                card_part: this.cardPart
                            };

                            const response = await fetch('/api/matches', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(matchData)
                            });

                            if (response.ok) {
                                alert('Match saved successfully!');
                                window.location.href = '/card/' + this.selectedCardId;
                            } else {
                                alert('Failed to save match');
                            }
                        }
                    }
                }
            </script>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 UFC Matchmaker. For educational purposes only.</p>
        </div>
    </footer>
</body>

</html>
