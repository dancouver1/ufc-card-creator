version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ufc_matchmaker_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufcuser -d ufc_matchmaker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ufc_matchmaker_app
    environment:
      DATABASE_URL: postgres://${DB_USER:-ufcuser}:${DB_PASSWORD:-ufcpass}@db:5432/${DB_NAME:-ufc_matchmaker}?sslmode=disable
      PORT: ${PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates

volumes:
  postgres_data: